[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-agents"
version = "0.1.0"
description = "Deterministic rice pest knowledge graph retrieval kernel"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.27.2",
    "kuzu==0.11.3",
    "openai==1.30.0",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]
