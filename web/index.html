<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="基于可溯源水稻知识图谱的诊断演示">
    <title>稻作诊断台</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20241f;
        --muted: #667067;
        --line: #d8ddd6;
        --paper: #f7f8f5;
        --surface: #ffffff;
        --field: #f0f3ee;
        --green: #25633f;
        --teal: #17656a;
        --amber: #9a5d13;
        --red: #9c3731;
        --shadow: 0 14px 36px rgba(32, 36, 31, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        letter-spacing: 0;
      }

      button, textarea { font: inherit; }
      button { cursor: pointer; }

      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(23, 101, 106, 0.24);
        outline-offset: 2px;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .topbar-inner {
        width: min(1180px, calc(100% - 40px));
        min-height: 68px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .brand strong {
        font-size: 19px;
        font-weight: 720;
      }

      .brand span,
      .system-state {
        color: var(--muted);
        font-size: 12px;
      }

      .system-state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .system-state::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        content: "";
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 34px auto 64px;
        display: grid;
        grid-template-columns: minmax(280px, 350px) minmax(0, 1fr);
        gap: 34px;
        align-items: start;
      }

      .query-panel {
        position: sticky;
        top: 24px;
        padding: 4px 0;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.18;
      }

      .lead {
        margin: 12px 0 26px;
        color: var(--muted);
        line-height: 1.7;
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-size: 13px;
        font-weight: 700;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 142px;
        resize: vertical;
        border: 1px solid #bfc8bf;
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 14px;
        line-height: 1.6;
      }

      textarea::placeholder { color: #8a938a; }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .example-button {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        padding: 7px 9px;
        font-size: 12px;
      }

      .example-button:hover {
        border-color: #9ca89e;
        background: var(--field);
        color: var(--ink);
      }

      .submit-button {
        width: 100%;
        min-height: 44px;
        margin-top: 18px;
        border: 1px solid var(--green);
        border-radius: 5px;
        background: var(--green);
        color: white;
        font-weight: 700;
      }

      .submit-button:hover { background: #1c5233; }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.66;
      }

      .result-panel {
        min-height: 560px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .result-toolbar {
        min-height: 54px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .result-toolbar strong { font-size: 14px; }

      #result-state {
        color: var(--muted);
        font-size: 12px;
      }

      #result {
        min-height: 505px;
        padding: 28px;
      }

      .empty-state,
      .state-message {
        min-height: 430px;
        display: grid;
        align-content: center;
        justify-items: start;
      }

      .state-kicker {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .state-message h2,
      .empty-state h2,
      .diagnosis-heading h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
      }

      .state-message p,
      .empty-state p {
        max-width: 590px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .state-message[data-kind="abstained"] .state-kicker { color: var(--amber); }
      .state-message[data-kind="invalid"] .state-kicker,
      .state-message[data-kind="error"] .state-kicker { color: var(--red); }

      .diagnosis-heading {
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }

      .diagnosis-heading .state-kicker { color: var(--green); }

      .matched {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .section { padding: 25px 0 0; }

      .section + .section {
        margin-top: 25px;
        border-top: 1px solid var(--line);
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 15px;
      }

      .knowledge-grid,
      .suggestion-list {
        display: grid;
        gap: 10px;
      }

      .knowledge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .knowledge-item,
      .suggestion-item {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
        background: #fcfdfb;
      }

      .knowledge-item h3,
      .suggestion-item h3 {
        margin: 0;
        font-size: 14px;
      }

      .item-meta {
        margin: 6px 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .item-description {
        margin: 9px 0 0;
        color: #4e574f;
        font-size: 13px;
        line-height: 1.6;
      }

      .suggestion-item { border-left: 3px solid var(--teal); }

      .authority-note {
        margin: 8px 0 0;
        color: var(--red);
        font-size: 12px;
        font-weight: 700;
      }

      .evidence-wrap { overflow-x: auto; }

      table {
        width: 100%;
        min-width: 690px;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        padding: 10px 9px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--field);
        color: #4d574e;
        font-weight: 700;
      }

      td { color: #59625a; }

      .grounding-note {
        margin: 11px 0 0;
        color: var(--amber);
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .topbar-inner,
        main { width: min(100% - 28px, 680px); }

        .brand span,
        .system-state { display: none; }

        main {
          margin-top: 24px;
          grid-template-columns: 1fr;
          gap: 24px;
        }

        .query-panel { position: static; }
        .result-panel { min-height: 460px; }

        #result {
          min-height: 405px;
          padding: 22px 18px;
        }

        .empty-state,
        .state-message { min-height: 330px; }
        .knowledge-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <strong>稻作诊断台</strong>
          <span>Agri-Agents / M001</span>
        </div>
        <div class="system-state">确定性检索已连接</div>
      </div>
    </header>

    <main>
      <section class="query-panel" aria-labelledby="page-title">
        <p class="eyebrow">Rice diagnosis</p>
        <h1 id="page-title">水稻症状诊断</h1>
        <p class="lead">检索命中后生成诊断，已验证知识与模型补充建议分区展示。</p>

        <form id="diagnosis-form">
          <label for="symptoms">症状描述</label>
          <textarea
            id="symptoms"
            name="symptoms"
            placeholder="例如：叶片出现褐色病斑"
            maxlength="2000"
            autocomplete="off"
          ></textarea>
          <div class="examples" aria-label="示例输入">
            <button class="example-button" type="button" data-example="叶片出现褐色病斑">
              命中示例
            </button>
            <button class="example-button" type="button" data-example="不存在的症状XYZ">
              未命中示例
            </button>
          </div>
          <button id="submit-button" class="submit-button" type="submit">开始诊断</button>
        </form>
      </section>

      <section class="result-panel" aria-labelledby="result-title">
        <div class="result-toolbar">
          <strong id="result-title">诊断结果</strong>
          <span id="result-state">等待输入</span>
        </div>
        <div id="result" data-status="IDLE" aria-live="polite">
          <div class="empty-state">
            <p class="state-kicker">READY</p>
            <h2>尚未提交症状</h2>
            <p>结果将在此处按诊断、弃权或输入无效三种状态显示。</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#diagnosis-form");
      const input = document.querySelector("#symptoms");
      const submitButton = document.querySelector("#submit-button");
      const result = document.querySelector("#result");
      const resultState = document.querySelector("#result-state");

      function element(tag, options = {}, children = []) {
        const node = document.createElement(tag);
        if (options.className) node.className = options.className;
        if (options.text !== undefined) node.textContent = String(options.text);
        for (const [name, value] of Object.entries(options.attributes || {})) {
          node.setAttribute(name, value);
        }
        for (const child of children) node.append(child);
        return node;
      }

      function setResultState(status, label) {
        result.dataset.status = status;
        resultState.textContent = label;
      }

      function renderMessage(status, kind, kicker, title, message) {
        setResultState(status, kicker);
        result.replaceChildren(
          element("div", { className: "state-message", attributes: { "data-kind": kind } }, [
            element("p", { className: "state-kicker", text: kicker }),
            element("h2", { text: title }),
            element("p", { text: message }),
          ]),
        );
      }

      function formatConfidence(value) {
        const number = Number(value);
        return Number.isFinite(number) ? `${Math.round(number * 100)}%` : "-";
      }

      function renderKnowledge(items) {
        const grid = element("div", { className: "knowledge-grid" });
        for (const item of items) {
          const properties = item.properties || {};
          const description =
            properties.description || properties.safety_note || properties.category || properties.crop;
          const children = [
            element("h3", { text: properties.name || item.id || "知识实体" }),
            element("p", {
              className: "item-meta",
              text: `${item.type || "Entity"} / ${item.id || "-"}`,
            }),
          ];
          if (description) {
            children.push(element("p", { className: "item-description", text: description }));
          }
          grid.append(element("article", { className: "knowledge-item" }, children));
        }
        return grid;
      }

      function renderSuggestions(items) {
        const list = element("div", { className: "suggestion-list" });
        for (const item of items) {
          list.append(
            element("article", { className: "suggestion-item" }, [
              element("h3", { text: item.label || "模型补充建议" }),
              element("p", { className: "item-description", text: item.text }),
              element("p", {
                className: "item-meta",
                text: (item.referenced_entity_ids || []).join(" / "),
              }),
              element("p", { className: "authority-note", text: "模型生成，非权威处方" }),
            ]),
          );
        }
        return list;
      }

      function renderEvidence(items) {
        const body = element("tbody");
        for (const item of items) {
          const properties = item.properties || {};
          body.append(
            element("tr", {}, [
              element("td", { text: item.type || "-" }),
              element("td", { text: `${item.source_id || "-"} → ${item.target_id || "-"}` }),
              element("td", { text: properties.source || "-" }),
              element("td", { text: properties.version || "-" }),
              element("td", { text: formatConfidence(properties.confidence) }),
            ]),
          );
        }
        return element("div", { className: "evidence-wrap" }, [
          element("table", {}, [
            element("thead", {}, [
              element("tr", {}, [
                element("th", { text: "关系" }),
                element("th", { text: "实体路径" }),
                element("th", { text: "来源" }),
                element("th", { text: "版本" }),
                element("th", { text: "置信度" }),
              ]),
            ]),
            body,
          ]),
        ]);
      }

      function section(title, content) {
        return element("section", { className: "section" }, [
          element("h3", { className: "section-title", text: title }),
          content,
        ]);
      }

      function renderDiagnosed(data) {
        setResultState("DIAGNOSED", "已完成");
        const diagnosisText = data.diagnosis
          ? data.diagnosis.text
          : "模型结论未通过 grounding 校验，未予展示。";
        const content = [
          element("div", { className: "diagnosis-heading" }, [
            element("p", { className: "state-kicker", text: "DIAGNOSED" }),
            element("h2", { text: diagnosisText }),
            element("p", {
              className: "matched",
              text: `匹配症状：${(data.matched_symptoms || []).join("、") || "-"}`,
            }),
          ]),
          section("已验证知识", renderKnowledge(data.verified_knowledge || [])),
          section(
            "模型补充建议",
            data.model_suggestions && data.model_suggestions.length
              ? renderSuggestions(data.model_suggestions)
              : element("p", { className: "item-description", text: "没有通过 grounding 校验的模型建议。" }),
          ),
          section("证据链", renderEvidence(data.evidence_chain || [])),
        ];
        if (data.grounding_rejections) {
          content.push(
            element("p", {
              className: "grounding-note",
              text: `已过滤 ${data.grounding_rejections} 条越界生成内容。`,
            }),
          );
        }
        result.replaceChildren(...content);
      }

      function renderResponse(data) {
        if (data.status === "DIAGNOSED") {
          renderDiagnosed(data);
          return;
        }
        if (data.status === "ABSTAINED") {
          renderMessage("ABSTAINED", "abstained", "ABSTAINED", "检索未命中，已弃权", data.reason);
          return;
        }
        if (data.status === "INVALID_INPUT") {
          renderMessage("INVALID_INPUT", "invalid", "INVALID INPUT", "输入无效", data.reason);
          return;
        }
        renderMessage("ERROR", "error", "ERROR", "响应状态无法识别", "请稍后重试。");
      }

      async function submitDiagnosis() {
        submitButton.disabled = true;
        result.setAttribute("aria-busy", "true");
        submitButton.textContent = "诊断中";
        setResultState("LOADING", "处理中");
        try {
          const response = await fetch("/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symptoms: input.value }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(typeof data.detail === "string" ? data.detail : "诊断请求失败");
          }
          renderResponse(data);
        } catch (error) {
          renderMessage(
            "ERROR",
            "error",
            "REQUEST FAILED",
            "诊断请求失败",
            error instanceof Error ? error.message : "请稍后重试。",
          );
        } finally {
          result.removeAttribute("aria-busy");
          submitButton.disabled = false;
          submitButton.textContent = "开始诊断";
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        submitDiagnosis();
      });

      document.querySelectorAll("[data-example]").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.dataset.example;
          input.focus();
        });
      });
    </script>
  </body>
</html>
